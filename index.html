<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VendaLink — Find local traders near you</title>
  <meta name="description" content="Discover street vendors and informal traders near you — live status, stock, and payment options.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-row">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>VendaLink</h1>
      </div>
      <a href="vendor-admin.html" class="vendor-login-link" title="Vendor Login">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span class="vendor-login-text">Vendor</span>
      </a>
    </div>
    <p class="tagline">Find local traders near you</p>

    <div class="controls">
      <button id="geo-btn" class="btn-locate" type="button">
        <span aria-hidden="true">⌖</span> Use my location
      </button>
      <label class="open-toggle">
        <input type="checkbox" id="open-only">
        <span>Open now only</span>
      </label>
    </div>

    <div class="search-wrapper">
      <input 
        type="search" 
        id="search-box" 
        class="search-box" 
        placeholder="Search vendors or products..."
        autocomplete="off"
      >
    </div>

    <div id="category-bar" class="category-bar" role="tablist" aria-label="Filter by category">
      <!-- Category pills injected by app.js -->
    </div>
  </header>

  <main id="vendor-list" aria-live="polite">
    <p class="loading">Loading nearby traders…</p>
  </main>

  <footer class="foot-note">
    <p>VendaLink · Built for GKHack26 · Street Economy</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
